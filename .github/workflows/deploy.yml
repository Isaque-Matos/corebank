jobs:
  build:

  deploy-homologacao:
    needs: build
    runs-on: ubuntu-latest
    environment: homologacao
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            [ -d corebank ] || git clone https://github.com/Isaque-Matos/corebank.git corebank
            cd corebank && git pull
            docker build -t corebank .
            docker rm -f corebank || true
            docker run -d --name corebank --restart always -p 80:80 corebank

  deploy-producao:
    needs: deploy-homologacao
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            [ -d corebank ] || git clone https://github.com/Isaque-Matos/corebank.git corebank
            cd corebank && git pull
            docker build -t corebank .
            docker rm -f corebank || true
            docker run -d --name corebank --restart always -p 80:80 corebank